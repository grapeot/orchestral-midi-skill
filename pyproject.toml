[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestral-midi-skill"
version = "0.1.0"
description = "Explicit orchestral scores and reproducible stereo/binaural rendering"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mido>=1.3", "numpy>=1.26", "scipy>=1.12", "h5py>=3.10", "soundfile>=0.12", "pydantic>=2.7"]

[project.scripts]
orchestral-midi = "orchestral_midi.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestral_midi"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
